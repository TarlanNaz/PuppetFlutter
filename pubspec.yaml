name: puppet
description: "Клиент каталога Puppet Forge (ЛР1)"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  flutter_bloc: ^9.1.1
  intl: ^0.20.3
  dio: ^5.11.1
  json_annotation: ^4.12.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
